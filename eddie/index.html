<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09070c">
  <meta name="description" content="Happy birthday, Eddie!">
  <meta property="og:title" content="HAPPY BIRTHDAY EDDIE!">
  <meta property="og:image" content="https://a.skh.am/eddie/images/01-house-party-1280.webp">
  <meta name="twitter:card" content="summary_large_image">
  <title>Happy birthday, Eddie!</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="stage">
    <h1 class="visually-hidden">Happy birthday, Eddie!</h1>
    <ul class="slides" id="slides">
      <li class="slide is-current">
        <img class="backdrop" src="images/01-house-party-640.webp" alt="" aria-hidden="true">
        <img class="photo" src="images/01-house-party-1920.webp" srcset="images/01-house-party-1920.webp 1920w, images/01-house-party-3840.webp 3840w" sizes="100vw" width="3840" height="2160" alt="A packed living-room party full of Eddies under giant balloon letters reading Happy Birthday Eddie." fetchpriority="high">
      </li>
    </ul>
    <section class="video-slot" id="video-slot" aria-label="Birthday video">
      <iframe src="https://www.youtube-nocookie.com/embed/VkTVM8ywdTo?loop=1&amp;playlist=VkTVM8ywdTo&amp;playsinline=1&amp;rel=0" title="Eddie's birthday video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </section>
    <button class="toggle" id="toggle" type="button" aria-pressed="false" aria-label="Pause slideshow" title="Pause slideshow" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="toggle-icon" d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></svg>
    </button>
  </main>
</body>
</html>
