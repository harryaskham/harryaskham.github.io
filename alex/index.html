<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070425">
  <meta name="description" content="Happy birthday, Alexander David ‘Sticks’ Cross!">
  <meta property="og:title" content="HAPPY BIRTHDAY, ALEX!">
  <meta property="og:image" content="https://a.skh.am/alex/images/alex.jpg">
  <title>★ Happy birthday, Alex! ★</title>
  <link rel="icon" href="images/cake.png">
  <link rel="stylesheet" href="style.css">
  <script src="player.js" type="module"></script>
</head>
<body>
  <main>
    <header>
      <p class="welcome">★ Welcome to the birthday zone ★</p>
      <div class="birthday-banner">
        <picture class="decoration"><source media="(prefers-reduced-motion: reduce)" srcset="images/balloons.png"><img src="images/balloons.gif" width="128" height="128" alt=""></picture>
        <h1>HAPPY BIRTHDAY<span>ALEX!</span></h1>
        <picture class="decoration"><source media="(prefers-reduced-motion: reduce)" srcset="images/cake.png"><img src="images/cake.gif" width="128" height="128" alt=""></picture>
      </div>
    </header>
    <div class="rainbow" aria-hidden="true"></div>
    <figure>
      <div class="photo-frame"><img class="hero" src="images/alex.jpg" width="1200" height="677" alt="Looking over a pair of glasses at the camera." fetchpriority="high"></div>
      <figcaption>Alexander David <strong>“Sticks”</strong> Cross</figcaption>
    </figure>
    <section class="controls" aria-label="Birthday audio">
      <button id="play" type="button" aria-label="Play" aria-pressed="false">
        <svg viewBox="0 0 64 64" aria-hidden="true"><path id="icon" d="M24 14 50 32 24 50Z"/></svg>
        <span id="label">Play</span>
      </button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <div class="rainbow" aria-hidden="true"></div>
    <footer>★ Best viewed with the volume up ★</footer>
  </main>
  <audio id="audio" preload="none"></audio>
</body>
</html>
